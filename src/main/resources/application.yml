spring:
  application:
    name: catalog-service

  datasource:
    url: jdbc:postgresql://localhost:5432/catalog_db
    username: postgres
    password: admin

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8080

aws:
  s3:
    bucket: ecommerce-catalog-images-949687826439-ap-southeast-2-an
    region: ap-southeast-2

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics